<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Marketplace Laboratory: instructor view</title>
<style>
:root { --text: #1f1e1c; --muted: #52514e; --line: #e4e3df; --panel: #f6f5f3; --primary: #2a78d6; --primary-dark: #1f5fae;
        --accent: #eb6834; --gain: #2a78d6; --loss: #e34948; --radius: 8px; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: "Source Sans 3", "Source Sans Pro", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
       color: var(--text); background: #fff; font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 18px 24px 60px; }
h1 { font-size: 1.7rem; margin: 0 0 2px; }

.caption, .small { color: var(--muted); font-size: 0.86rem; }
.note { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 8px 0 12px; color: var(--muted); font-size: 0.92rem; }
.info { background: #e7f1fb; color: #1f5fae; padding: 10px 14px; border-radius: var(--radius); margin: 10px 0; }
.error { background: #fbebeb; color: #9b1c1c; padding: 10px 14px; border-radius: var(--radius); margin: 10px 0; }
.success { background: #e5f4e4; color: #1f6b2a; padding: 8px 12px; border-radius: var(--radius); margin: 8px 0; font-size: 0.92rem; }
.panel { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; margin: 10px 0; background: #fff; }
.panel.shaded { background: var(--panel); }
details.panel > summary { cursor: pointer; font-weight: 600; list-style: none; }

details[open].panel > summary::before { content: "▾ "; }
details.panel > summary::-webkit-details-marker { display: none; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.cols-4-8 { display: grid; grid-template-columns: 4fr 8fr; gap: 24px; align-items: start; }
@media (max-width: 900px) { .cols, .cols-4-8 { grid-template-columns: 1fr; } }
label { display: block; font-size: 0.9rem; color: var(--text); margin: 8px 0 3px; }
input[type=number], input[type=text], select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); width: 100%; }
input[type=number]:focus, input[type=text]:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); background: #fff; }

.radio input { margin-top: 4px; }

button:hover { border-color: var(--primary); color: var(--primary); }
button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
button.primary:hover { background: var(--primary-dark); color: #fff; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 12px; }

.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tabs.inner { margin: 6px 0 8px; }

table.grid th, table.grid td { border: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: middle; }
table.grid th { background: var(--panel); font-weight: 600; color: var(--muted); }
table.grid td.num, table.grid th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid input { padding: 4px 6px; background: #fff; }
table.grid input[type=number] { text-align: right; }
table.spec td:first-child input { min-width: 90px; }
table.grid td.remove { width: 32px; text-align: center; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 8px; }
.metric .label { color: var(--muted); font-size: 0.86rem; }
.metric .value { font-size: 1.9rem; font-weight: 400; line-height: 1.15; }
.metric .delta { font-size: 0.86rem; display: inline-block; padding: 1px 8px; border-radius: 10px; margin-top: 3px; }
.metric .delta.up { background: #e5f4e4; color: #1f6b2a; } .metric .delta.down { background: #fbebeb; color: #9b1c1c; }
.metric .delta.up.inverse { background: #fbebeb; color: #9b1c1c; } .metric .delta.down.inverse { background: #e5f4e4; color: #1f6b2a; }
.chart { width: 100%; height: auto; display: block; }
.chart .tick { font-size: 11px; fill: var(--muted); } .chart .axis { font-size: 12px; fill: var(--muted); }
.chart .note-text { font-size: 13px; font-weight: 600; }
table.grid td.marked { box-shadow: inset 0 0 0 2px #c8102e; border-radius: 3px; }
.dwl-note { margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 2px 0 6px; }
.legend-item { border: none; background: none; padding: 2px 4px; font-size: 0.82rem; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.legend-item.off { color: #b5b4ae; text-decoration: line-through; }
.legend-item:disabled { color: var(--text); opacity: 1; cursor: default; }
.sw { display: inline-block; width: 18px; height: 10px; } .sw.line { height: 0; } .sw.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; background: #fff; }
.bars { margin: 6px 0 10px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; font-size: 0.86rem; }
.bar-label { width: 36%; text-align: right; color: var(--muted); }
.bar-track { position: relative; flex: 1; height: 22px; background: var(--panel); }
.bar-track::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px solid #b5b4ae; }
.bar { position: absolute; top: 2px; bottom: 2px; } .bar.gain { background: var(--gain); } .bar.loss { background: var(--loss); }
.bar-val { position: absolute; top: 2px; font-size: 0.8rem; color: var(--muted); white-space: nowrap; width: 44px; text-align: right; }
.bar-val:not([style*='max']) { text-align: left; }
.pin { display: grid; grid-template-columns: 3fr 3.5fr 1.6fr; gap: 10px; align-items: end; }
@media (max-width: 900px) { .pin { grid-template-columns: 1fr; } }
.group-line { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.group-form { display: grid; grid-template-columns: 1.6fr 6fr 1.3fr; gap: 10px; align-items: end; }
.group-form.with-pin { grid-template-columns: 1.4fr 1.2fr 5fr 1.3fr; }
@media (max-width: 900px) { .group-form { grid-template-columns: 1fr; } }
.status { color: var(--muted); font-size: 0.86rem; margin-top: 8px; }
.status.err { color: #9b1c1c; }
.badge { display: inline-block; font-size: 0.78rem; padding: 1px 8px; border-radius: 10px; background: var(--panel); color: var(--muted); margin-left: 8px; }
.labbook-wrap { overflow-x: auto; }
table.grid.labbook td { white-space: nowrap; }
table.grid.labbook th { white-space: normal; min-width: 120px; }
table.grid.labbook th .remove-entry { float: right; margin-left: 8px; padding: 0 6px; line-height: 1.5; color: var(--muted); background: #fff; }
table.grid.labbook th .remove-entry:hover { color: var(--loss); border-color: var(--loss); }
table.grid.labbook td .delta { display: block; font-size: 11px; line-height: 1.2; color: var(--muted); }
.question { margin: 18px 0 6px; } .question h3 { margin: 0 0 4px; font-size: 1rem; }
footer { margin-top: 30px; color: var(--muted); font-size: 0.8rem; }
[hidden] { display: none !important; }
.qsection { margin: 20px 0 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.qsection h2 { margin: 4px 0 6px; font-size: 1.05rem; }
details.prompt > summary { cursor: pointer; color: var(--primary); font-size: 0.9rem; list-style: none; }
details.prompt > summary::before { content: "\25B8 "; font-size: 0.8em; }
details[open].prompt > summary::before { content: "\25BE "; }
details.prompt > summary::-webkit-details-marker { display: none; }
details.prompt > p { margin: 6px 0 10px; color: var(--muted); font-size: 0.95rem; }
form.helper { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 8px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 6px; }
form.helper input { width: 86px; padding: 5px 7px; } form.helper input.name { width: 110px; } form.helper select { width: auto; padding: 5px 7px; }
form.helper span { display: inline-flex; gap: 6px; } form.helper.invalid { border-color: var(--loss); }

/* Instructor page: on top of style.css */
.signin { display: grid; grid-template-columns: 2fr 1.6fr 1fr; gap: 12px; align-items: end; max-width: 760px; }
@media (max-width: 900px) { .signin { grid-template-columns: 1fr; } }
.signin label.check { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; }
.signin label.check input { width: auto; }
.class-bar { display: grid; grid-template-columns: 2fr 3fr auto; gap: 14px; align-items: end; }
.class-bar .projector { text-align: center; } .class-bar .projector .caption { font-size: 0.78rem; margin-top: 4px; max-width: 260px; }
@media (max-width: 900px) { .class-bar { grid-template-columns: 1fr; } }
.class-bar .summary { color: var(--muted); font-size: 0.9rem; padding-bottom: 8px; }
.wide { overflow-x: auto; }
table.grid.sticky th:first-child, table.grid.sticky td:first-child { position: sticky; left: 0; background: #fff; z-index: 1; }
table.grid.sticky th:first-child { background: var(--panel); }
table.grid td.tick { text-align: center; white-space: nowrap; }
table.grid td.ok { color: #1f6b2a; } table.grid td.bad { color: #9b1c1c; } table.grid td.unk { color: var(--muted); }
.links { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0; }
@media (max-width: 900px) { .links { grid-template-columns: 1fr 1fr; } }
a.button { display: inline-block; text-align: center; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); background: #fff; color: var(--text); text-decoration: none; font-size: 0.92rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
a.button:hover { border-color: var(--primary); color: var(--primary); }
a.button.primary { background: var(--primary); border-color: var(--primary); color: #fff; font-size: 1rem; padding: 10px 16px; }
a.button.primary:hover { background: var(--primary-dark); }
.answer { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 8px 0; white-space: pre-wrap; }
.answer .who { font-weight: 600; margin-bottom: 4px; }
.setup-grid { display: grid; grid-template-columns: 3fr 1.2fr; gap: 20px; align-items: start; }
@media (max-width: 900px) { .setup-grid { grid-template-columns: 1fr; } }
.linkbox { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92rem; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; word-break: break-all; }
.qr { display: block; width: 200px; height: 200px; border: 1px solid var(--line); }
.form-row { display: grid; grid-template-columns: 3fr 1.2fr; gap: 12px; align-items: end; }
.form-row.three { grid-template-columns: 2fr 2fr 1.3fr; }
@media (max-width: 900px) { .form-row, .form-row.three { grid-template-columns: 1fr; } }
hr.sep { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
.qblock { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; margin: 10px 0; }
.qblock h3 { margin: 0 0 6px; font-size: 1rem; }
.section-title { font-weight: 600; margin: 10px 0 6px; }
.err-text { color: #9b1c1c; }

</style>

<body>
<div class="wrap">
  <div class="row between">
    <div><h1>Marketplace Laboratory: instructor view</h1><p class="caption" id="subtitle">The groups' lab books, straight from the class record.</p></div>
    <div id="topbar" class="row"></div>
  </div>
  <div id="signin"></div>
  <div id="main" hidden>
    <div id="class-bar" class="panel shaded"></div>
    <details id="setup" class="panel"><summary>Class set-up: link and QR code, new classes, registered groups</summary><div id="setup-body"></div></details>
    <nav class="tabs" id="views">
      <button type="button" data-view="overview" class="active">Overview</button>
      <button type="button" data-view="experiment">By experiment</button>
      <button type="button" data-view="group">One group</button>
    </nav>
    <section id="view-overview"></section>
    <section id="view-experiment" hidden></section>
    <section id="view-group" hidden></section>
  </div>
  <footer><span id="footer-status"></span></footer>
</div>
<script>window.MARKETLAB_CONFIG = {"endpoint": "https://script.google.com/macros/s/AKfycbwW81B0dE2LprFnKPKBrGQhMi8r1JiZkeWoPOj4zGk6sepwOcdNyhMr_lhTNBFZus7r5A/exec", "app_url": "https://eozdenoren.github.io/marketlab"};</script>
<script>
/* Marketplace Laboratory engine: a line-by-line port of app/engine.py,
   app/externality.py and the measures/labels of app/labbook.py.
   Plain script: defines MarketLab (browser) and exports it for Node tests. */
var MarketLab = (function () {
  "use strict";
  var SUPPLY = "supply", DEMAND = "demand";
  var RULES = ["efficient", "random", "inefficient"];
  var CONTROLS = ["none", "ceiling", "floor", "quota"];

  function clip(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
  function normSeg(s) {
    var lo = Math.min(+s.pmin, +s.pmax), hi = Math.max(+s.pmin, +s.pmax);
    return { quantity: Math.max(0, +s.quantity), pmin: lo, pmax: hi };
  }
  function supplyRegions(m) { return m.regions.filter(function (r) { return r.side === SUPPLY; }); }
  function demandRegions(m) { return m.regions.filter(function (r) { return r.side === DEMAND; }); }

  // ---- policy -------------------------------------------------------------
  function defaultPolicy(over) {
    var p = { cost_shock: 0, benefit_boost: 0, tax_supply: 0, tax_demand: 0, control: "none",
              control_value: null, rationing: "efficient", rent_to: "sellers", regional: {} };
    if (over) for (var k in over) if (Object.prototype.hasOwnProperty.call(over, k) && over[k] !== undefined) p[k] = over[k];
    if (!p.regional) p.regional = {};
    return p;
  }
  function regionPolicy(policy, name) {
    var rp = (policy.regional || {})[name] || {};
    return { scale: rp.scale == null ? 1 : +rp.scale, shift: +(rp.shift || 0), tax: +(rp.tax || 0),
             cap: rp.cap == null ? null : +rp.cap };
  }
  function stripped(policy) {
    var reg = {};
    for (var k in policy.regional || {}) {
      var v = regionPolicy(policy, k);
      reg[k] = { scale: v.scale, shift: v.shift, tax: 0, cap: null };
    }
    return defaultPolicy({ cost_shock: policy.cost_shock, benefit_boost: policy.benefit_boost, regional: reg });
  }

  // ---- effective segments and curves ---------------------------------------
  function effBlock(e) { return e.hi - e.lo <= 0; }
  function effDensity(e) { return effBlock(e) ? Infinity : e.mass / (e.hi - e.lo); }
  function effQ(e, p, limit) {
    if (e.mass <= 0) return 0;
    if (e.side === SUPPLY) {
      if (effBlock(e)) { if (p > e.lo) return e.mass; if (p < e.lo) return 0; return limit === "right" ? e.mass : 0; }
      return e.mass * clip((p - e.lo) / (e.hi - e.lo));
    }
    if (effBlock(e)) { if (p < e.hi) return e.mass; if (p > e.hi) return 0; return limit === "left" ? e.mass : 0; }
    return e.mass * clip((e.hi - p) / (e.hi - e.lo));
  }
  function buildEffective(market, policy) {
    var out = [];
    market.regions.forEach(function (r) {
      var rp = regionPolicy(policy, r.name);
      r.segments.forEach(function (s0, i) {
        var s = normSeg(s0), shift, tax, offset;
        if (r.side === SUPPLY) { shift = rp.shift + policy.cost_shock; tax = rp.tax + policy.tax_supply; offset = shift + tax; }
        else { shift = rp.shift + policy.benefit_boost; tax = rp.tax + policy.tax_demand; offset = shift - tax; }
        out.push({ region: r.name, side: r.side, index: i, mass: s.quantity * Math.max(0, rp.scale),
                   lo: s.pmin + offset, hi: s.pmax + offset, offset: offset, shift: shift, tax: tax });
      });
    });
    return out;
  }

  function Curves(market, policy) {
    this.market = market; this.policy = policy; this.effs = buildEffective(market, policy);
    this.caps = {};
    var self = this;
    supplyRegions(market).forEach(function (r) { var rp = regionPolicy(policy, r.name); if (rp.cap != null) self.caps[r.name] = rp.cap; });
    this.tol = 1e-9 * Math.max(1, this.effs.reduce(function (a, e) { return a + e.mass; }, 0));
  }
  Curves.prototype.supplyRegion = function (name, p, limit) {
    limit = limit || "right"; var q = 0;
    for (var i = 0; i < this.effs.length; i++) { var e = this.effs[i]; if (e.region === name && e.side === SUPPLY) q += effQ(e, p, limit); }
    var cap = this.caps[name]; return cap == null ? q : Math.min(q, Math.max(0, cap));
  };
  Curves.prototype.supply = function (p, limit) {
    limit = limit || "right"; var s = 0, regs = supplyRegions(this.market);
    for (var i = 0; i < regs.length; i++) s += this.supplyRegion(regs[i].name, p, limit);
    return s;
  };
  Curves.prototype.demand = function (p, limit) {
    limit = limit || "left"; var d = 0;
    for (var i = 0; i < this.effs.length; i++) if (this.effs[i].side === DEMAND) d += effQ(this.effs[i], p, limit);
    return d;
  };
  Curves.prototype.excess = function (p, limit) { return this.supply(p, limit) - this.demand(p, limit); };
  Curves.prototype.totalSupplyMass = function () {
    var t = 0, self = this;
    supplyRegions(this.market).forEach(function (r) {
      var m = 0; self.effs.forEach(function (e) { if (e.region === r.name) m += e.mass; });
      var cap = self.caps[r.name]; t += cap == null ? m : Math.min(cap, m);
    });
    return t;
  };
  Curves.prototype.totalDemandMass = function () { var t = 0; this.effs.forEach(function (e) { if (e.side === DEMAND) t += e.mass; }); return t; };
  Curves.prototype.breakpoints = function () {
    var pts = {}, self = this;
    this.effs.forEach(function (e) { if (e.mass > 0) { pts[e.lo] = e.lo; pts[e.hi] = e.hi; } });
    Object.keys(this.caps).forEach(function (name) { var p = self.regionInverseSupply(name, self.caps[name]); if (p != null) pts[p] = p; });
    return Object.keys(pts).map(function (k) { return pts[k]; }).sort(function (a, b) { return a - b; });
  };
  Curves.prototype.regionInverseSupply = function (name, q) {
    var segs = this.effs.filter(function (e) { return e.region === name && e.side === SUPPLY && e.mass > 0; });
    return inverseQuantity(segs, q, SUPPLY);
  };
  Curves.prototype.clear = function () {
    var flags = { indeterminate_price: false, no_trade: false };
    var S = this.totalSupplyMass(), D = this.totalDemandMass(), bps = this.breakpoints();
    if (S <= this.tol || D <= this.tol || !bps.length) { flags.no_trade = true; return [bps.length ? bps[0] : 0, 0, flags]; }
    var tol = this.tol, n = bps.length, self = this;
    var eRight = bps.map(function (b) { return self.excess(b, "right"); });
    var eLeft = [-D].concat(bps.slice(1).map(function (b) { return self.excess(b, "left"); }));
    for (var i = 0; i < n; i++) {
      var eL = eLeft[i], eR = eRight[i];
      if (eL <= tol && eR >= -tol && (eL < -tol || eR > tol)) {
        var p = bps[i], q = Math.min(this.supply(p, "right"), this.demand(p, "left"));
        return this.flatAdjust(p, q, i, bps, eRight, eLeft, flags);
      }
      if (i < n - 1 && eR < -tol && eLeft[i + 1] > tol) {
        var a = bps[i], b = bps[i + 1], pp = a + (b - a) * (-eR) / (eLeft[i + 1] - eR);
        return [pp, this.supply(pp, "right"), flags];
      }
    }
    var pl = bps[n - 1];
    return [pl, Math.min(this.supply(pl, "right"), this.demand(pl, "left")), flags];
  };
  Curves.prototype.flatAdjust = function (p, q, i, bps, eRight, eLeft, flags) {
    var tol = this.tol; if (Math.abs(eRight[i]) > tol) return [p, q, flags];
    var j = i, n = bps.length;
    while (j < n - 1 && Math.abs(eRight[j]) <= tol && Math.abs(eLeft[j + 1]) <= tol) j++;
    if (j > i) { var pHi = bps[j]; flags.indeterminate_price = true; flags.price_interval = [p, pHi];
                 var mid = 0.5 * (p + pHi); return [mid, this.supply(mid, "right"), flags]; }
    return [p, q, flags];
  };
  Curves.prototype.inverseDemand = function (q) {
    var bps = this.breakpoints(), self = this;
    if (q <= this.tol) return bps.length ? bps[bps.length - 1] : 0;
    var p = inverseDemandFn(function (x, l) { return self.demand(x, l); }, bps, q, this.tol);
    return p != null ? p : (bps.length ? bps[0] : 0);
  };
  Curves.prototype.inverseSupply = function (q) {
    var bps = this.breakpoints(), self = this;
    if (q <= this.tol) return bps.length ? bps[0] : 0;
    var p = inverseSupplyFn(function (x, l) { return self.supply(x, l); }, bps, q, this.tol);
    return p != null ? p : (bps.length ? bps[bps.length - 1] : 0);
  };

  function inverseSupplyFn(S, bps, q, tol) {
    if (!bps.length) return null;

  function answersCsv(books) {
    var graded = QUESTIONS.filter(function (q) { return q.id !== "own"; });
    var rows = [["class", "group", "members", "pins", "last saved"].concat(QUESTIONS.map(function (q) { return q.title; })).concat(["debrief notes"])];
    books.forEach(function (bk) {
      rows.push([bk["class"], bk.group, bk.names, entriesOf(bk).length, fmtTime(bk.last)].concat(QUESTIONS.map(function (q) { return bk.answers[q.id] || ""; })).concat([bk.notes || ""]));
    });
    void graded;
    return csv(rows);
  }
  function renderOverview(books, cls) {
    var nq = QUESTIONS.length, graded = QUESTIONS.filter(function (q) { return q.id !== "own"; });
    var h = '<div class="wide"><table class="grid sticky"><thead><tr><th>Group</th><th>Members</th>';
    for (var i = 0; i < nq - 1; i++) h += '<th class="tick">' + (i + 1) + '</th>';
    h += '<th class="tick">Own</th><th class="num">Pins</th><th>Verified</th><th>Answered</th><th>Last saved</th><th>Debrief notes</th></tr></thead><tbody>';
    books.forEach(function (bk) {
      var entries = entriesOf(bk), counts = [];
      for (var k = 0; k < nq; k++) counts.push(0);
      entries.forEach(function (e) { counts[questionIndex(e.question)]++; });
      var answered = graded.filter(function (q) { return (bk.answers[q.id] || "").trim(); }).length;
      var c = verifiedCounts(entries);
      var verified = !entries.length ? "" : (!c.bad && !c.unknown ? "✓ all" : (c.bad ? "✗ " + c.bad + " differ" : "? " + c.unknown + " unclear"));
      var note = (bk.notes || "").trim().split(/\r?\n/)[0] || "";
      h += '<tr><td>' + esc(bk.group) + '</td><td>' + esc(bk.names) + '</td>' +
           counts.map(function (n) { return '<td class="tick">' + ticks(n) + '</td>'; }).join("") +
           '<td class="num">' + entries.length + '</td><td class="' + (c.bad ? "bad" : (c.unknown ? "unk" : "ok")) + '">' + verified + '</td>' +
           '<td>' + (answered ? answered + "/" + graded.length : "") + '</td><td>' + esc(lastSaved(bk.last)) + '</td>' +
           '<td>' + esc(note.length > 90 ? note.slice(0, 90) + "…" : note) + '</td></tr>';
    });
    h += '</tbody></table></div>' +
         '<p class="caption">One row per group; a tick per pinned experiment under its question number; Own is the group’s own experiments. ' +
         'Answered counts the questions with an answer. Verified: every pinned column recomputed from its saved settings matches the numbers the group’s page reported. ' +
         'The full debrief notes are in One group.</p>' +
         '<div class="row"><button type="button" id="csv-books">Download the lab books as CSV (one row per pinned column)</button>' +
         '<button type="button" id="csv-answers">Download the answers as CSV (one row per group)</button></div>';
    $("view-overview").innerHTML = h;
    var tag = cls || "no_class";
    $("csv-books").onclick = function () { download("lab_books_" + tag + ".csv", labBooksCsv(books)); };
    $("csv-answers").onclick = function () { download("answers_" + tag + ".csv", answersCsv(books)); };
  }

  // ---- By experiment -----------------------------------------------------------------------
  function linkButtons(items) {    // [[label, href]]
    return '<div class="links">' + items.map(function (it) { return '<a class="button" target="_blank" rel="noopener" href="' + esc(it[1]) + '" title="' + esc(it[0]) + '">' + esc(it[0]) + '</a>'; }).join("") + '</div>';
  }
  function renderByExperiment(books) {
    var titles = QUESTIONS.map(function (q) { return q.title; });
    if (titles.indexOf(S.q) < 0) S.q = titles[0];
    var h = '<label for="q-pick">Experiment</label><select id="q-pick">' + selectOptions(titles, S.q) + '</select>';
    var pins = [];
    books.forEach(function (bk) { entriesOf(bk).forEach(function (e) { if (e.question === S.q) pins.push([bk, e]); }); });
    var qid = QUESTIONS[titles.indexOf(S.q)].id;
    if (pins.length) {
      var measures = M.MEASURES.filter(function (m) { return pins.some(function (p) { return p[1].measures[m] != null; }); })
                      .concat(M.extraMeasures(pins.map(function (p) { return p[1].measures; })));
      var noted = pins.some(function (p) { return p[1].note; });
      h += '<div class="wide"><table class="grid sticky"><thead><tr><th>Group</th><th>Experiment</th><th>Verified</th>' +
           measures.map(function (m) { return '<th class="num">' + esc(m) + '</th>'; }).join("") + (noted ? "<th>Note</th>" : "") + '</tr></thead><tbody>';
      pins.forEach(function (p) {
        var bk = p[0], e = p[1], v = verifyEntry(e);
        h += '<tr><td>' + esc(bk.group) + '</td><td>' + esc(e.label) + '</td><td class="' + markClass(e) + '">' + mark(e) + (v.ok === false ? " " + esc(v.bad.join(", ")) : "") + '</td>' +
             measures.map(function (m) { return '<td class="num">' + B.cell(e.measures[m]) + '</td>'; }).join("") + (noted ? '<td>' + esc(e.note || "") + '</td>' : "") + '</tr>';
      });
      var groups = {}; pins.forEach(function (p) { groups[p[0].group] = 1; });
      h += '</tbody></table></div><p class="caption">' + plural(pins.length, "pinned column") + " across " + plural(Object.keys(groups).length, "group") +
           '. Rows that disagree with the rest are the ones to ask about.</p>' +
           '<div class="section-title">Open on the projector (the class page in a new tab, projector mode: change anything, pin, nothing is sent to the record)</div>' +
           linkButtons(pins.map(function (p) { return [p[0].group + ": " + p[1].label, projectorLink(p[1].state, p[0]["class"])]; }));
    } else {
      h += '<div class="info">No group has pinned anything under this question yet.</div>';
    }
    var answered = books.filter(function (bk) { return (bk.answers[qid] || "").trim(); });
    if (answered.length) {
      h += '<div class="section-title">Answers to this question</div>';
      answered.forEach(function (bk) {
        var n = entriesOf(bk).filter(function (e) { return e.question === S.q; }).length;
        h += '<div class="answer"><div class="who">' + esc(bk.group) + (bk.names ? " · " + esc(bk.names) : "") + ' <span class="badge">' + n + ' pinned here</span></div>' + esc(bk.answers[qid]) + '</div>';
      });
    }
    $("view-experiment").innerHTML = h;
    $("q-pick").onchange = function () { S.q = this.value; renderByExperiment(books); };
  }

  // ---- One group ------------------------------------------------------------------------
  function renderOneGroup(books) {
    var names = books.map(function (bk) { return bk.group || "(no group number)"; });
    if (!S.group || names.indexOf(S.group) < 0) S.group = names[0];
    var bk = books[names.indexOf(S.group)], entries = entriesOf(bk);
    var h = '<label for="g-pick">Group</label><select id="g-pick">' + selectOptions(names, S.group) + '</select>' +
            '<p class="caption">' + (bk.names ? esc(bk.names) + " · " : "") + "Last saved " + fmtTime(bk.last) + " · " + plural(entries.length, "pinned experiment") + '</p>';
    var byQ = {}, marks = {};
    entries.forEach(function (e) { var i = questionIndex(e.question); (byQ[i] = byQ[i] || []).push(e); marks[e.id] = '<span class="' + markClass(e) + '">' + mark(e) + '</span>'; });
    var nothing = [];
    QUESTIONS.forEach(function (q, i) {
      var mine = byQ[i] || [], answer = (bk.answers[q.id] || "").trim();
      if (!mine.length && !answer) { nothing.push(q.title); return; }
      h += '<div class="qblock"><h3>' + esc(q.title) + ' <span class="badge">' + mine.length + ' pinned</span></h3>';
      if (mine.length) {
        h += B.table(mine, { mark: marks });
        var bad = mine.filter(function (e) { return verifyEntry(e).ok === false; });
        if (bad.length) h += '<div class="error">Not matching the saved settings when recomputed: ' + esc(bad.map(function (e) { return e.label + " (" + verifyEntry(e).bad.join(", ") + ")"; }).join("; ")) + '</div>';
        h += '<p class="caption">Open on the projector (the class page in a new tab, projector mode):</p>' +
             linkButtons(mine.map(function (e) { return [e.label, projectorLink(e.state, bk["class"])]; }));
      } else {
        h += '<p class="caption">Nothing pinned under this question.</p>';
      }
      if (answer) h += '<div class="section-title">' + (q.id === "own" ? "What the group learned" : "Answer") + '</div><div class="answer">' + esc(answer) + '</div>';
      else if (q.id !== "own") h += '<p class="caption">No answer yet.</p>';
      h += '</div>';
    });
    if (nothing.length) h += '<p class="caption">Nothing yet under: ' + esc(nothing.join("; ")) + '.</p>';
    if (entries.length) {
      var c = verifiedCounts(entries);
      h += '<p class="caption">' + (c.bad ? c.bad + " of " + entries.length + " columns do not match their saved settings (marked ✗ above)."
            : (c.unknown ? plural(c.unknown, "column") + " could not be recomputed from the saved settings."
            : "All columns verified: recomputing each from its saved settings gives the numbers shown.")) + '</p>';
    }
    if (bk.notes) h += '<div class="section-title">Notes for the debrief</div><div class="answer">' + esc(bk.notes) + '</div>';
    bk.other.forEach(function (f) { h += '<p><i>' + esc(f.question || "") + '</i> · ' + fmtTime(f.ts || 0) + '<br>' + esc(f.finding || "") + '</p>'; });
    $("view-group").innerHTML = h;
    $("g-pick").onchange = function () { S.group = this.value; renderOneGroup(books); };
  }

  // ---- Class set-up ---------------------------------------------------------------------
  function qrPng(text, scale, border) {
    var m = MLQR.matrix(text), n = m.length, size = (n + 2 * border) * scale;
    var cv = document.createElement("canvas"); cv.width = size; cv.height = size;
    var ctx = cv.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size); ctx.fillStyle = "#000";
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (m[r][c]) ctx.fillRect((c + border) * scale, (r + border) * scale, scale, scale);
    return cv.toDataURL("image/png");
  }
  function renderSetup(cls, books) {
    var h = "";
    if (cls) {
      var link = classLink(cls);
      h += '<div class="setup-grid"><div><p style="margin:4px 0 6px">Link for class <b>' + esc(cls) + '</b> (put it on the slide; one link and QR code per class):</p>' +
           '<div class="linkbox" id="class-link">' + esc(link) + '</div>' +
           '<div class="row" style="margin-top:8px"><button type="button" id="copy-link">Copy the link</button><span class="caption" id="copy-msg"></span></div>' +
           '<p class="caption">The code appears under the group box on the students’ page and is stamped on everything they pin, so classes never mix.</p></div>' +
           '<div>' + MLQR.svg(link, 200).replace("<svg ", '<svg class="qr" id="qr-svg" ') + '<button type="button" id="qr-download" style="width:200px;margin-top:8px">Download QR (PNG)</button></div></div><hr class="sep">';
    }
    h += '<form id="new-class" class="form-row"><div><label for="new-code">New class code</label><input type="text" id="new-code" placeholder="MIM-A-9Nov" autocomplete="off"></div>' +
         '<div><button type="submit" class="primary" style="width:100%">Create class</button></div></form>' +
         '<p class="caption">Letters, digits, dots, dashes; short enough to read off a slide.</p><div id="class-error" class="error" hidden></div>';
    if (cls) {
      h += '<hr class="sep"><div class="section-title">Registered groups and PINs for class ' + esc(cls) + '</div>' +
           '<p class="caption">A group chooses its own PIN the first time it uses its number in this class; after that the number and PIN must match. ' +
           'If a group registered the wrong number, reset that number here: the right group can then register it, and the group that was reset registers again with a new PIN. Pinned work is never lost.</p>' +
           '<div id="groups-box"><p class="caption">Reading the registered groups…</p></div>';
    }
    $("setup-body").innerHTML = h;
    $("setup").ontoggle = function () { S.setupOpen = $("setup").open; };
    if (cls) {
      $("copy-link").onclick = function () {
        var done = function () { $("copy-msg").textContent = "Copied."; setTimeout(function () { $("copy-msg").textContent = ""; }, 2000); };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(classLink(cls)).then(done, function () { $("copy-msg").textContent = "Select the link and copy it."; });
        else $("copy-msg").textContent = "Select the link and copy it.";
      };
      $("qr-download").onclick = function () {
        var a = document.createElement("a"); a.href = qrPng(classLink(cls), 10, 2); a.download = "marketlab_" + cls + ".png";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
      };
      renderGroups(cls);
    }
    $("new-class").onsubmit = function (ev) {
      ev.preventDefault();
      var code = cleanClassCode($("new-code").value), errEl = $("class-error");
      if (!code) { errEl.textContent = "Please type a short class code, for example MIM-A-9Nov."; errEl.hidden = false; return; }
      var btn = this.querySelector("button"); btn.disabled = true; btn.textContent = "Creating…";
      var rec = classRecord(code);
      post({ token: S.cred, records: [rec] }).then(function (j) {
        if (!j || !j.ok) throw new Error((j && j.error) || "no answer");
        S.created[code] = rec.ts; S.records.push(rec); rebuild(); S.cls = code; S.group = ""; S.setupOpen = true;
        try { localStorage.setItem(CLASS_KEY, code); } catch (e) {}
        render();
      }).catch(function (err) { btn.disabled = false; btn.textContent = "Create class"; errEl.textContent = "Could not save the class: " + String(err && err.message || err); errEl.hidden = false; });
    };
  }
  function renderGroups(cls, message) {    // message: html shown under the table after a redraw (the reset's outcome)
    var draw = function (groups) {
      var box = $("groups-box"); if (!box) return;
      if (!groups.length) { box.innerHTML = '<div class="info">No group has registered in this class yet.</div>' + (message || ""); return; }
      var h = '<div class="wide"><table class="grid"><thead><tr><th>Group</th><th>PIN</th><th>Members</th><th>Registered (UTC)</th></tr></thead><tbody>' +
              groups.map(function (g) { return '<tr><td>' + esc(g.group) + '</td><td>' + esc(g.pin) + '</td><td>' + esc(g.names || "") + '</td><td>' + esc(String(g.registered || "").slice(0, 16).replace("T", " ")) + '</td></tr>'; }).join("") +
              '</tbody></table></div><div class="form-row three" style="margin-top:8px"><div><button type="button" id="csv-groups" style="width:100%">Download the group list (CSV)</button></div>' +
              '<div><label for="reset-pick">Group to reset</label><select id="reset-pick">' + selectOptions(groups.map(function (g) { return g.group; }), "") + '</select></div>' +
              '<div><button type="button" id="reset-btn" style="width:100%">Reset this group’s registration</button></div></div><div id="reset-msg">' + (message || "") + '</div>';
      box.innerHTML = h;
      $("csv-groups").onclick = function () {
        download("groups_" + cls + ".csv", csv([["class", "group", "pin", "members", "registered"]].concat(groups.map(function (g) { return [cls, g.group, g.pin, g.names || "", g.registered || ""]; }))));
      };
      $("reset-btn").onclick = function () {
        var pick = $("reset-pick").value, msg = $("reset-msg");
        if (!window.confirm("Reset the registration of " + pick + " in class " + cls + "? Its pinned work is kept; it registers again with a new PIN.")) return;
        post({ token: S.cred, action: "reset", "class": cls, group: pick }).then(function (j) {
          if (!j || !j.ok) throw new Error((j && j.error) || "no answer");
          delete S.groups[cls];
          renderGroups(cls, '<div class="success">' + esc(pick) + ' can register again with a new PIN. Its pinned work is kept.</div>');
        }).catch(function (err) { msg.innerHTML = '<div class="error">Could not reset: ' + esc(String(err && err.message || err)) + '</div>'; });
      };
    };
    if (S.groups[cls]) { draw(S.groups[cls]); return; }
    api({ token: S.cred, action: "groups", "class": cls }).then(function (j) {
      if (!j || !j.ok) throw new Error((j && j.error) || "no answer");
      S.groups[cls] = j.groups || []; draw(S.groups[cls]);
    }).catch(function (err) { var box = $("groups-box"); if (box) box.innerHTML = '<div class="error">Could not read the registered groups: ' + esc(String(err && err.message || err)) + '</div>'; });
  }

  // ---- init -----------------------------------------------------------------------------
  function init() {
    Array.prototype.forEach.call($("views").querySelectorAll("button"), function (b) { b.onclick = function () { S.view = b.getAttribute("data-view"); render(); }; });
    var cred = storedCred();
    if (!cred || !ENDPOINT) { renderSignin(); return; }
    S.cred = cred;
    $("signin").innerHTML = '<p class="caption">Reading the class record…</p>';
    loadRecords(function (err) {
      if (err) { S.cred = ""; if (/bad token|locked/.test(err)) clearCred(); renderSignin(/bad token/.test(err) ? "The saved password is no longer accepted; sign in again." : "Could not reach the class record (" + err + ")."); return; }
      start();
    });
  }
  document.addEventListener("DOMContentLoaded", init);
  window.MarketLabInstructor = { state: S, booksFromFindings: booksFromFindings, verifyEntry: verifyEntry, projectorLink: projectorLink, classLink: classLink };
})();

</script>
